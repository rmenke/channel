name: C/C++ CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v4
    - name: touch autotool artifacts
      run: touch aclocal.m4 configure Makefile.in test/Makefile.in
    - name: configure
      run: ./configure
    - name: make
      run: make
    - name: make check
      run: make check
    - name: make distcheck
      run: make distcheck
    - name: upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-products
        path: test/*.ppm
        retention-days: 2
